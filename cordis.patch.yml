# strata-monitor 的 bundle 补丁。
# package.json 的 dsh.bundle.patch 指向本文件：`dsh plugin add` 之后 profile 的
# dsh.profile.bundles 会包含本包，下面 insert 的插件行随之生效。
# ⚠️ 不要再在 profile 的 cordis.patch.yml 里手写同一段 —— 同一个 id 挂载两次会报错。
# 回退：把 strata-monitor 从 dsh.profile.bundles 里删掉（或 CLI remove）。
- insert:
    - id: strata-monitor
      name: 'strata-monitor'
